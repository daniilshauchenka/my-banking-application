services:
  account-postgres:
    image: postgres:16-alpine
    container_name: my-bank-account-postgres
    environment:
      POSTGRES_DB: ${ACCOUNT_DB_NAME:-account_service}
      POSTGRES_USER: ${ACCOUNT_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${ACCOUNT_DB_PASSWORD:-postgres}
    command: ["postgres", "-p", "6432"]
    ports:
      - "${ACCOUNT_DB_PORT:-6432}:6432"
    volumes:
      - account-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 6432 -U ${ACCOUNT_DB_USERNAME:-postgres} -d ${ACCOUNT_DB_NAME:-account_service}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  transfer-postgres:
    image: postgres:16-alpine
    container_name: my-bank-transfer-postgres
    environment:
      POSTGRES_DB: ${TRANSFER_DB_NAME:-transfer_service}
      POSTGRES_USER: ${TRANSFER_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${TRANSFER_DB_PASSWORD:-postgres}
    command: ["postgres", "-p", "6433"]
    ports:
      - "${TRANSFER_DB_PORT:-6433}:6433"
    volumes:
      - transfer-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 6433 -U ${TRANSFER_DB_USERNAME:-postgres} -d ${TRANSFER_DB_NAME:-transfer_service}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  cash-postgres:
    image: postgres:16-alpine
    container_name: my-bank-cash-postgres
    environment:
      POSTGRES_DB: ${CASH_DB_NAME:-cash_service}
      POSTGRES_USER: ${CASH_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${CASH_DB_PASSWORD:-postgres}
    command: ["postgres", "-p", "6434"]
    ports:
      - "${CASH_DB_PORT:-6434}:6434"
    volumes:
      - cash-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 6434 -U ${CASH_DB_USERNAME:-postgres} -d ${CASH_DB_NAME:-cash_service}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  notification-postgres:
    image: postgres:16-alpine
    container_name: my-bank-notification-postgres
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME:-notification_service}
      POSTGRES_USER: ${NOTIFICATION_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-postgres}
    command: ["postgres", "-p", "6435"]
    ports:
      - "${NOTIFICATION_DB_PORT:-6435}:6435"
    volumes:
      - notification-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 6435 -U ${NOTIFICATION_DB_USERNAME:-postgres} -d ${NOTIFICATION_DB_NAME:-notification_service}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: my-bank-keycloak
    command:
      - start-dev
      - --http-port=6060
      - --hostname=localhost
      - --hostname-strict=false
      - --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
    ports:
      - "6060:6060"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    restart: unless-stopped

  account-service:
    build:
      context: ./account-service
    container_name: my-bank-account-service
    environment:
      ACCOUNT_DB_URL: jdbc:postgresql://account-postgres:6432/${ACCOUNT_DB_NAME:-account_service}
      ACCOUNT_DB_USERNAME: ${ACCOUNT_DB_USERNAME:-postgres}
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:-postgres}
      NOTIFICATION_SERVICE_URL: http://notification-service:6084
      KEYCLOAK_ISSUER_URI: http://localhost:6060/realms/my-bank
      KEYCLOAK_JWK_SET_URI: http://keycloak:6060/realms/my-bank/protocol/openid-connect/certs
      KEYCLOAK_TOKEN_URI: http://keycloak:6060/realms/my-bank/protocol/openid-connect/token
      ACCOUNT_SERVICE_CLIENT_SECRET: ${ACCOUNT_SERVICE_CLIENT_SECRET:-account-secret}
    ports:
      - "6081:6081"
    depends_on:
      keycloak:
        condition: service_started
      account-postgres:
        condition: service_healthy
      notification-service:
        condition: service_started
    restart: unless-stopped

  transfer-service:
    build:
      context: ./transfer-service
    container_name: my-bank-transfer-service
    environment:
      ACCOUNT_SERVICE_URL: http://account-service:6081
      TRANSFER_DB_URL: jdbc:postgresql://transfer-postgres:6433/${TRANSFER_DB_NAME:-transfer_service}
      TRANSFER_DB_USERNAME: ${TRANSFER_DB_USERNAME:-postgres}
      TRANSFER_DB_PASSWORD: ${TRANSFER_DB_PASSWORD:-postgres}
      KEYCLOAK_ISSUER_URI: http://localhost:6060/realms/my-bank
      KEYCLOAK_JWK_SET_URI: http://keycloak:6060/realms/my-bank/protocol/openid-connect/certs
      KEYCLOAK_TOKEN_URI: http://keycloak:6060/realms/my-bank/protocol/openid-connect/token
      TRANSFER_SERVICE_CLIENT_SECRET: ${TRANSFER_SERVICE_CLIENT_SECRET:-transfer-secret}
    ports:
      - "6082:6082"
    depends_on:
      keycloak:
        condition: service_started
      transfer-postgres:
        condition: service_healthy
      account-service:
        condition: service_started
    restart: unless-stopped

  notification-service:
    build:
      context: ./notification-service
    container_name: my-bank-notification-service
    environment:
      NOTIFICATION_DB_URL: jdbc:postgresql://notification-postgres:6435/${NOTIFICATION_DB_NAME:-notification_service}
      NOTIFICATION_DB_USERNAME: ${NOTIFICATION_DB_USERNAME:-postgres}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-postgres}
      KEYCLOAK_ISSUER_URI: http://localhost:6060/realms/my-bank
      KEYCLOAK_JWK_SET_URI: http://keycloak:6060/realms/my-bank/protocol/openid-connect/certs
    ports:
      - "6084:6084"
    depends_on:
      keycloak:
        condition: service_started
      notification-postgres:
        condition: service_healthy
    restart: unless-stopped

  cash-service:
    build:
      context: ./cash-service
    container_name: my-bank-cash-service
    environment:
      ACCOUNT_SERVICE_URL: http://account-service:6081
      NOTIFICATION_SERVICE_URL: http://notification-service:6084
      CASH_DB_URL: jdbc:postgresql://cash-postgres:6434/${CASH_DB_NAME:-cash_service}
      CASH_DB_USERNAME: ${CASH_DB_USERNAME:-postgres}
      CASH_DB_PASSWORD: ${CASH_DB_PASSWORD:-postgres}
      KEYCLOAK_ISSUER_URI: http://localhost:6060/realms/my-bank
      KEYCLOAK_JWK_SET_URI: http://keycloak:6060/realms/my-bank/protocol/openid-connect/certs
      KEYCLOAK_TOKEN_URI: http://keycloak:6060/realms/my-bank/protocol/openid-connect/token
      CASH_SERVICE_CLIENT_SECRET: ${CASH_SERVICE_CLIENT_SECRET:-cash-secret}
    ports:
      - "6083:6083"
    depends_on:
      keycloak:
        condition: service_started
      cash-postgres:
        condition: service_healthy
      account-service:
        condition: service_started
      notification-service:
        condition: service_started
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
    container_name: my-bank-api-gateway
    environment:
      ACCOUNT_SERVICE_URL: http://account-service:6081
      TRANSFER_SERVICE_URL: http://transfer-service:6082
      CASH_SERVICE_URL: http://cash-service:6083
      NOTIFICATION_SERVICE_URL: http://notification-service:6084
      KEYCLOAK_ISSUER_URI: http://localhost:6060/realms/my-bank
      KEYCLOAK_JWK_SET_URI: http://keycloak:6060/realms/my-bank/protocol/openid-connect/certs
    ports:
      - "6080:6080"
    depends_on:
      - keycloak
      - account-service
      - transfer-service
      - cash-service
      - notification-service
    restart: unless-stopped

  front-ui:
    build:
      context: ./front-ui
    container_name: my-bank-front-ui
    environment:
      GATEWAY_URL: http://api-gateway:6080
      KEYCLOAK_AUTHORIZATION_URI: http://localhost:6060/realms/my-bank/protocol/openid-connect/auth
      KEYCLOAK_TOKEN_URI: http://keycloak:6060/realms/my-bank/protocol/openid-connect/token
      KEYCLOAK_USER_INFO_URI: http://keycloak:6060/realms/my-bank/protocol/openid-connect/userinfo
      KEYCLOAK_JWK_SET_URI: http://keycloak:6060/realms/my-bank/protocol/openid-connect/certs
    ports:
      - "6085:6085"
    depends_on:
      - keycloak
      - api-gateway
    restart: unless-stopped

volumes:
  account-postgres-data:
  transfer-postgres-data:
  cash-postgres-data:
  notification-postgres-data:
