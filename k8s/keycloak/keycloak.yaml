apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: my-bank
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 6060
      targetPort: 6060
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: my-bank
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0.7
          args:
            - start-dev
            - --http-port=6060
            - --hostname=localhost
            - --hostname-strict=false
            - --import-realm
          ports:
            - containerPort: 6060
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: my-bank-app-secrets
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: my-bank-app-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: KC_HTTP_ENABLED
              value: "true"
          readinessProbe:
            httpGet:
              path: /realms/my-bank
              port: 6060
            initialDelaySeconds: 40
            periodSeconds: 10
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import/realm-export.json
              subPath: realm-export.json
              readOnly: true
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
