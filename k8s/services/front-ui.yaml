apiVersion: v1
kind: Service
metadata:
  name: front-ui
  namespace: my-bank
spec:
  selector:
    app: front-ui
  ports:
    - name: http
      port: 6085
      targetPort: 6085
    - name: management
      port: 7085
      targetPort: 7085
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-ui
  namespace: my-bank
spec:
  replicas: 1
  selector:
    matchLabels:
      app: front-ui
  template:
    metadata:
      labels:
        app: front-ui
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: front-ui
          image: my-bank/front-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 6085
            - name: management
              containerPort: 7085
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: my-bank-app-config
          env:
            - name: SERVER_PORT
              value: "6085"
            - name: MANAGEMENT_PORT
              value: "7085"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
