apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: my-bank
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 6080
      targetPort: 6080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: my-bank
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: my-bank/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6080
          envFrom:
            - configMapRef:
                name: my-bank-app-config
          env:
            - name: SERVER_PORT
              value: "6080"
          readinessProbe:
            tcpSocket:
              port: 6080
            initialDelaySeconds: 40
            periodSeconds: 10
