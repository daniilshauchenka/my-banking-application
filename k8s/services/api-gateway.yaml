apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: my-bank
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 6080
      targetPort: 6080
    - name: management
      port: 7080
      targetPort: 7080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: my-bank
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-gateway
          image: my-bank/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 6080
            - name: management
              containerPort: 7080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: my-bank-app-config
          env:
            - name: SERVER_PORT
              value: "6080"
            - name: MANAGEMENT_PORT
              value: "7080"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
