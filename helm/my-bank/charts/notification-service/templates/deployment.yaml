apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.global.namespace.name }}
spec:
  selector:
    app: {{ .Chart.Name }}
  ports:
    - name: management
      port: {{ .Values.managementPort }}
      targetPort: {{ .Values.managementPort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.global.namespace.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: {{ .Values.global.image.repositoryPrefix }}/{{ .Values.image }}:{{ .Values.global.image.tag }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: management
              containerPort: {{ .Values.managementPort }}
          envFrom:
            - configMapRef:
                name: {{ .Values.global.configMapName }}
            {{- if .Values.envSecret }}
            - secretRef:
                name: {{ .Values.global.secretName }}
            {{- end }}
          env:
            - name: MANAGEMENT_PORT
              value: {{ .Values.managementPort | quote }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            initialDelaySeconds: {{ .Values.initialDelaySeconds }}
            periodSeconds: 10
