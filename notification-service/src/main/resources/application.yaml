spring:
  application:
    name: notification-service
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:6435/notification_service}
    username: ${NOTIFICATION_DB_USERNAME:postgres}
    password: ${NOTIFICATION_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: ${KAFKA_NOTIFICATIONS_GROUP_ID:notification-service}
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
    producer:
      acks: all
      retries: 10
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true

app:
  kafka:
    notifications-topic: ${KAFKA_NOTIFICATIONS_TOPIC:bank.notifications}
    notifications-dlt-topic: ${KAFKA_NOTIFICATIONS_DLT_TOPIC:bank.notifications.dlt}
    notifications-topic-partitions: ${KAFKA_NOTIFICATIONS_TOPIC_PARTITIONS:1}
    notifications-topic-replicas: ${KAFKA_NOTIFICATIONS_TOPIC_REPLICAS:1}
    retry-interval: ${KAFKA_RETRY_INTERVAL:1000}
    retry-max-attempts: ${KAFKA_RETRY_MAX_ATTEMPTS:3}
  notifications:
    scheduler-delay: 5000

management:
  server:
    port: ${MANAGEMENT_PORT:6084}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
