databaseChangeLog:
  - changeSet:
      id: 001-create-transfer-records
      author: codex
      changes:
        - createTable:
            tableName: transfer_records
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: from_account_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: to_account_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: numeric(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: error_message
                  type: varchar(255)
              - column:
                  name: from_balance
                  type: numeric(19, 2)
              - column:
                  name: to_balance
                  type: numeric(19, 2)
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            tableName: transfer_records
            indexName: idx_transfer_records_status_created_at
            columns:
              - column:
                  name: status
              - column:
                  name: created_at
