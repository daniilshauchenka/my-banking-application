databaseChangeLog:
  - changeSet:
      id: 001-insert-transfer-records
      author: codex
      changes:
        - insert:
            tableName: transfer_records
            columns:
              - column:
                  name: from_account_id
                  valueNumeric: 1
              - column:
                  name: to_account_id
                  valueNumeric: 2
              - column:
                  name: amount
                  valueNumeric: 25.00
