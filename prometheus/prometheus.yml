global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: account-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["account-service:7081"]

  - job_name: transfer-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["transfer-service:7082"]

  - job_name: cash-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["cash-service:7083"]

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:6084"]

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:7080"]

  - job_name: front-ui
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["front-ui:7085"]
