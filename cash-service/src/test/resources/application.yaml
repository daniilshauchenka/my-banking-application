spring:
  config:
    import: ""

  cloud:
    config:
      enabled: false

  datasource:
    url: jdbc:h2:mem:cash_service_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  liquibase:
    enabled: false

  kafka:
    bootstrap-servers: localhost:9094

account-service:
  url: http://localhost:6081

eureka:
  client:
    enabled: false

app:
  security:
    enabled: false
  kafka:
    notifications-topic: bank.notifications
