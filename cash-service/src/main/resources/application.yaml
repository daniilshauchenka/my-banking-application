server:
  port: 6083

spring:
  application:
    name: cash-service

  datasource:
    url: ${CASH_DB_URL:jdbc:postgresql://localhost:6434/cash_service}
    username: ${CASH_DB_USERNAME:postgres}
    password: ${CASH_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:6060/realms/my-bank}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:6060/realms/my-bank/protocol/openid-connect/certs}
      client:
        registration:
          cash-service:
            provider: keycloak
            client-id: cash-service
            client-secret: ${CASH_SERVICE_CLIENT_SECRET:cash-secret}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:6060/realms/my-bank/protocol/openid-connect/token}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

account-service:
  url: ${ACCOUNT_SERVICE_URL:http://localhost:6081}

notification-service:
  url: ${NOTIFICATION_SERVICE_URL:http://localhost:6084}
