server:
  port: 6080

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:6060/realms/my-bank}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:6060/realms/my-bank/protocol/openid-connect/certs}

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: account-service
              uri: lb://account-service
              predicates:
                - Path=/accounts/**
            - id: transfer-service
              uri: lb://transfer-service
              predicates:
                - Path=/transfers/**
            - id: cash-service
              uri: lb://cash-service
              predicates:
                - Path=/cash/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:6071/eureka/
